name: Stride API CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-test:
    name: Compilación y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias y empaquetar JAR
        run: ./mvnw -B package

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: stride-api-jar
          path: target/*.jar

  codeql:
    name: Análisis de seguridad (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Compilar proyecto para CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Ejecutar análisis de seguridad CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  docker-build:
    name: Construcción y publicación de imagen Docker
    needs: [build-and-test, codeql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/attlas-software-fundation/software-estimation-api:latest
            ghcr.io/attlas-software-fundation/software-estimation-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue en VPS por SSH
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar contenedor en VPS mediante SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker network create stride-net || true
            if ! docker ps -a --format '{{.Names}}' | grep -q '^stride-db$'; then
              docker run -d \
                --name stride-db \
                --restart unless-stopped \
                --network stride-net \
                -p 127.0.0.1:5432:5432 \
                -e POSTGRES_DB=stride \
                -e POSTGRES_USER="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
                -e POSTGRES_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
                -v stride_postgres_data:/var/lib/postgresql/data \
                postgres:17-alpine
              sleep 5
            else
              docker start stride-db || true
            fi
            docker pull ghcr.io/attlas-software-fundation/software-estimation-api:latest
            docker stop stride-api || true
            docker rm stride-api || true
            docker run -d \
              --name stride-api \
              --restart unless-stopped \
              --network stride-net \
              -p 127.0.0.1:8085:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e SPRING_MAIL_USERNAME="${{ secrets.SPRING_MAIL_USERNAME }}" \
              -e SPRING_MAIL_PASSWORD="${{ secrets.SPRING_MAIL_PASSWORD }}" \
              -e IN_SCOPE_JWT_SECRET="${{ secrets.IN_SCOPE_JWT_SECRET }}" \
              -e IN_SCOPE_CORS_ALLOWED_ORIGINS="${{ secrets.IN_SCOPE_CORS_ALLOWED_ORIGINS }}" \
              -e IN_SCOPE_BUNNY_ACCESS_KEY="${{ secrets.IN_SCOPE_BUNNY_ACCESS_KEY }}" \
              -e AI_SERVICE_URL=http://stride-ai:8000 \
              ghcr.io/attlas-software-fundation/software-estimation-api:latest
            docker image prune -f
