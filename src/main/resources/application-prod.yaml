# Perfil producción (VPS). Variables de entorno inyectadas desde GitHub Secrets en el despliegue:
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_MAIL_USERNAME
#   SPRING_MAIL_PASSWORD
#   IN_SCOPE_JWT_SECRET
#   IN_SCOPE_CORS_ALLOWED_ORIGINS
#   IN_SCOPE_BUNNY_ACCESS_KEY
#   AI_SERVICE_URL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

in-scope:
  bunny:
    access-key: ${IN_SCOPE_BUNNY_ACCESS_KEY}
  jwt:
    secret: ${IN_SCOPE_JWT_SECRET}
  cors:
    allowed-origins: ${IN_SCOPE_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.intecx.stride: INFO
